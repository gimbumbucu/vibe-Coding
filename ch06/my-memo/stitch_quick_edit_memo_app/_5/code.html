<!-- FAB Suppression Check: Since this is a drawer screen (task-focused), the FAB is not rendered here to maintain clarity. -->
<script>
        // Simple micro-interactions for the drawer
        const drawer = document.getElementById('drawer');
        const scrim = document.getElementById('scrim');

        function closeDrawer() {
            drawer.classList.replace('drawer-open', 'drawer-closed');
            scrim.classList.replace('opacity-100', 'opacity-0');
            setTimeout(() => {
                scrim.style.display = 'none';
            }, 300);
        }

        scrim.addEventListener('click', closeDrawer);

        // Active state ripple simulation or feedback
        document.querySelectorAll('nav a').forEach(item => {
            item.addEventListener('click', (e) => {
                // Prevent navigation for demo
                e.preventDefault();
                // In a real app, logic for switching routes would go here
            });
        });
    </script>
