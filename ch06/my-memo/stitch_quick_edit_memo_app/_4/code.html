<!DOCTYPE html>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            color: #191c1e;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .search-input:focus-within {
            box-shadow: 0 0 0 2px #004ac620;
        }
        .backdrop-blur-ui {
            backdrop-filter: blur(8px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen pb-20">
<!-- Top Search Bar (Contextual Header) -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-ui border-b border-outline-variant">
<div class="max-w-container-max mx-auto px-md py-sm flex items-center gap-md">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors cursor-pointer active:opacity-80">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<div class="flex-1 flex items-center bg-surface-container-low rounded-full px-md py-xs border border-transparent focus-within:border-primary focus-within:bg-surface-container-lowest transition-all group">
<input autofocus="" class="w-full bg-transparent border-none focus:ring-0 text-body-md py-1 placeholder:text-on-surface-variant/60" placeholder="Search memos..." type="text"/>
<button class="flex items-center justify-center opacity-0 group-focus-within:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">close</span>
</button>
</div>
</div>
</header>
<main class="max-w-container-max mx-auto px-md pt-lg">
<!-- Recent Searches Section -->
<section class="mb-xl">
<div class="flex items-center justify-between mb-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Recent Searches</h2>
<button class="font-label-sm text-label-sm text-primary hover:underline transition-all cursor-pointer active:scale-95">
                    Clear All
                </button>
</div>
<div class="space-y-base">
<!-- Search Item 1 -->
<div class="flex items-center justify-between p-md rounded-xl hover:bg-surface-container-high transition-all cursor-pointer active:scale-[0.98]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant/60">history</span>
<span class="font-body-md text-body-md text-on-surface">Project X</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant/40 text-[18px]">north_west</span>
</div>
<!-- Search Item 2 -->
<div class="flex items-center justify-between p-md rounded-xl hover:bg-surface-container-high transition-all cursor-pointer active:scale-[0.98]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant/60">history</span>
<span class="font-body-md text-body-md text-on-surface">Grocery list</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant/40 text-[18px]">north_west</span>
</div>
<!-- Search Item 3 -->
<div class="flex items-center justify-between p-md rounded-xl hover:bg-surface-container-high transition-all cursor-pointer active:scale-[0.98]">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant/60">history</span>
<span class="font-body-md text-body-md text-on-surface">Meeting notes</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant/40 text-[18px]">north_west</span>
</div>
</div>
</section>
<!-- Suggested Tags Section -->
<section>
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">Suggested Tags</h2>
<div class="flex flex-wrap gap-sm">
<!-- Chip 1 -->
<button class="inline-flex items-center bg-secondary-container hover:bg-secondary-fixed text-on-secondary-container px-md py-sm rounded-full transition-all active:scale-95">
<span class="font-label-md text-label-md">#Work</span>
</button>
<!-- Chip 2 -->
<button class="inline-flex items-center bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant px-md py-sm rounded-full transition-all active:scale-95">
<span class="font-label-md text-label-md">#Personal</span>
</button>
<!-- Chip 3 -->
<button class="inline-flex items-center bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant px-md py-sm rounded-full transition-all active:scale-95">
<span class="font-label-md text-label-md">#Ideas</span>
</button>
<!-- Chip 4 -->
<button class="inline-flex items-center bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant px-md py-sm rounded-full transition-all active:scale-95">
<span class="font-label-md text-label-md">#Archive</span>
</button>
<!-- Chip 5 -->
<button class="inline-flex items-center bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant px-md py-sm rounded-full transition-all active:scale-95">
<span class="font-label-md text-label-md">#Travel</span>
</button>
</div>
</section>
<!-- Visual Decorative Area -->
<section class="mt-xl opacity-40">
<div class="p-xl border-2 border-dashed border-outline-variant rounded-2xl flex flex-col items-center justify-center text-center">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant mb-md">manage_search</span>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
                    Try searching for keywords, dates, or tags to find your memos quickly.
                </p>
</div>
</section>
</main>
<!-- Bottom Navigation (Semantic Match: Search is active) -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-[0_-2px_4px_rgba(0,0,0,0.04)] h-16 flex justify-around items-center px-gutter max-w-container-max left-1/2 -translate-x-1/2">
<!-- Notes Tab (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-lg py-xs hover:text-primary transition-all active:scale-95 duration-150">
<span class="material-symbols-outlined">description</span>
<span class="font-label-sm text-label-sm">Notes</span>
</button>
<!-- Search Tab (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-fixed text-on-secondary-container dark:text-on-secondary-fixed-variant rounded-full px-lg py-xs active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label-sm text-label-sm">Search</span>
</button>
<!-- Settings Tab (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-lg py-xs hover:text-primary transition-all active:scale-95 duration-150">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</button>
</nav>
<script>
        // Simple micro-interaction for clearing search
        const clearBtn = document.querySelector('header button:last-child');
        const input = document.querySelector('input');
        
        if (clearBtn && input) {
            clearBtn.addEventListener('click', () => {
                input.value = '';
                input.focus();
            });
        }

        // Logic for Clear All recent searches
        const clearAllBtn = document.querySelector('button.font-label-sm');
        const recentList = document.querySelector('section:first-of-type .space-y-base');
        
        if (clearAllBtn && recentList) {
            clearAllBtn.addEventListener('click', () => {
                recentList.style.opacity = '0';
                recentList.style.transform = 'translateY(-10px)';
                setTimeout(() => {
                    recentList.innerHTML = `
                        <div class="p-md text-center text-on-surface-variant/60 font-body-md italic">
                            No recent searches
                        </div>
                    `;
                    recentList.style.opacity = '1';
                    recentList.style.transform = 'translateY(0)';
                }, 200);
            });
        }
    </script>
</body></html>
