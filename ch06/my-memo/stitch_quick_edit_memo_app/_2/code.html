<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>New Memo - Memos</title>

                    "secondary": "#505f76",

                    "tertiary-fixed-dim": "#ffb596",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#003ea8",
                    "secondary-fixed-dim": "#b7c8e1",
                    "surface-dim": "#d8dadc",
                    "primary": "#004ac6",
                    "background": "#f7f9fb",
                    "surface": "#f7f9fb",
                    "primary-fixed-dim": "#b4c5ff",
                    "surface-container-low": "#f2f4f6",
                    "inverse-primary": "#b4c5ff",
                    "surface-container-highest": "#e0e3e5",
                    "on-surface-variant": "#434655",
                    "outline": "#737686",
                    "outline-variant": "#c3c6d7",
                    "on-secondary-fixed": "#0b1c30",
                    "inverse-surface": "#2d3133",
                    "on-surface": "#191c1e",
                    "secondary-container": "#d0e1fb",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "surface-container-high": "#e6e8ea",
                    "on-primary-fixed": "#00174b",
                    "on-secondary-container": "#54647a",
                    "on-secondary-fixed-variant": "#38485d",
                    "error-container": "#ffdad6",
                    "surface-container": "#eceef0",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f7f9fb",
                    "on-tertiary-fixed": "#360f00",
                    "tertiary-container": "#bc4800",
                    "tertiary": "#943700",
                    "tertiary-fixed": "#ffdbcd",
                    "error": "#ba1a1a",
                    "on-primary-container": "#eeefff",
                    "inverse-on-surface": "#eff1f3"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "xs": "4px",
                    "sm": "8px",
                    "gutter": "20px",
                    "base": "4px",
                    "xl": "40px",
                    "container-max": "1200px",

                    "lg": "24px"
            },
            "fontFamily": {

                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]

          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        
        textarea:focus, input:focus {
            outline: none;
        }

        .cursor-blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #004ac6 }
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen font-body-md text-body-md overflow-x-hidden">
<!-- TopAppBar for Contextual Task (Task-Focused - No Global Nav) -->
<header class="w-full sticky top-0 bg-surface dark:bg-surface-dim z-30 border-b border-outline-variant dark:border-outline">
<div class="flex items-center justify-between px-md py-sm max-w-container-max mx-auto h-16">
<!-- Cancel Button -->
<button class="flex items-center gap-xs px-md py-sm rounded-full text-on-surface-variant hover:bg-surface-container transition-colors active:opacity-80 cursor-pointer font-label-md text-label-md" onclick="history.back()">
<span class="material-symbols-outlined" data-icon="close">close</span>
<span class="hidden sm:inline">Cancel</span>
</button>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim absolute left-1/2 -translate-x-1/2">
                New Memo
            </h1>
<!-- Save Button -->
<button class="bg-primary text-on-primary px-lg py-sm rounded-full font-label-md text-label-md font-bold hover:shadow-md active:scale-95 transition-all cursor-pointer">Save &amp; Close</button>
</div>
</header>
<main class="max-w-[800px] mx-auto px-md pt-lg pb-xl flex flex-col min-h-[calc(100vh-64px)]">
<!-- Memo Metadata / Chips Row -->
<div class="flex items-center gap-sm mb-lg overflow-x-auto no-scrollbar">
<button class="flex items-center gap-xs bg-surface-container-high px-md py-xs rounded-full text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="label">label</span>
<span class="text-label-sm font-label-sm">Add Tags</span>
</button>
<button class="flex items-center gap-xs bg-surface-container-high px-md py-xs rounded-full text-on-surface-variant hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="folder_open">folder_open</span>
<span class="text-label-sm font-label-sm">General</span>
</button>
<div class="h-6 w-[1px] bg-outline-variant mx-xs"></div>
<span class="text-label-sm font-label-sm text-outline whitespace-nowrap">
                Last synced: Just now
            </span>
</div>
<!-- Title Input -->
<div class="mb-md">
<input autofocus="" class="w-full bg-transparent border-none p-0 font-headline-lg text-headline-lg placeholder:text-outline-variant text-on-surface focus:ring-0" id="memo-title" placeholder="Title" type="text">
</div>
<!-- Body Area (Large Text Area) -->
<div class="flex-grow flex flex-col">
<textarea class="w-full flex-grow bg-transparent border-none p-0 font-body-lg text-body-lg placeholder:text-outline-variant text-on-surface-variant focus:ring-0 resize-none leading-relaxed" id="memo-content" placeholder="Start typing your thoughts..."></textarea>
</div>
<!-- Bottom Formatting Toolbar (Minimal) -->
<div class="sticky bottom-md mt-lg flex items-center justify-between p-sm bg-surface-container-lowest dark:bg-surface-container-low rounded-xl shadow-lg border border-outline-variant dark:border-outline">
<div class="flex items-center gap-xs">
<button class="p-sm rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Bold">
<span class="material-symbols-outlined" data-icon="format_bold">format_bold</span>
</button>
<button class="p-sm rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Italic">
<span class="material-symbols-outlined" data-icon="format_italic">format_italic</span>
</button>
<button class="p-sm rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors" title="List">
<span class="material-symbols-outlined" data-icon="format_list_bulleted">format_list_bulleted</span>
</button>
<button class="p-sm rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Checklist">
<span class="material-symbols-outlined" data-icon="checklist">checklist</span>
</button>
</div>
<div class="flex items-center gap-xs">
<button class="p-sm rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Add Image">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
<button class="p-sm rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Add Voice Memo">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
<div class="h-6 w-[1px] bg-outline-variant mx-xs"></div>
<button class="p-sm rounded-lg hover:bg-surface-container-high text-on-surface-variant transition-colors" title="More Options">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</div>
</main>
<!-- Aesthetic Ambient Background Detail -->
<div class="fixed bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-background to-transparent pointer-events-none -z-10"></div>
<script>
        // Auto-focus logic and micro-interactions
        window.addEventListener('DOMContentLoaded', () => {
            const titleInput = document.getElementById('memo-title');
            const contentArea = document.getElementById('memo-content');
            
            // Initial focus
            titleInput.focus();

            // Handle enter in title to jump to content
            titleInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    contentArea.focus();
                }
            });

            // Auto-expand textarea (if needed, though flex-grow handles most)
            contentArea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        });

        // Simple Save Interaction
        const saveBtn = document.querySelector('button.bg-primary');
        saveBtn.addEventListener('click', () => {
            const originalText = saveBtn.innerText;
            saveBtn.innerText = 'Saving...';
            saveBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                saveBtn.innerText = 'Saved';
                saveBtn.classList.remove('bg-primary');
                saveBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                
                setTimeout(() => {
                    alert('Memo successfully saved to your notebook.');
                }, 200);
            }, 800);
        });
    </script>


</body></html>
