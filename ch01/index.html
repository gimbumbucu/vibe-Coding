<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사과 게임 (Fruit Box)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- 상단 헤더: 타이머, 점수 -->
        <header class="glass-panel header">
            <div class="stat">
                <span class="label">Time</span>
                <span id="timer" class="value">02:00</span>
            </div>
            <div class="title">
                <h1>사과 게임</h1>
                <p>드래그해서 합을 10으로 맞추세요!</p>
            </div>
            <div class="stat">
                <span class="label">Score</span>
                <span id="score" class="value">0</span>
            </div>
        </header>

        <!-- 메인 게임 보드 -->
        <main class="board-container glass-panel">
            <div id="game-board">
                <!-- 셀들이 JS에 의해 생성됩니다 -->
                <div id="selection-box"></div>
            </div>
        </main>

        <!-- 게임 오버 오버레이 -->
        <div id="game-over-overlay" class="hidden glass-panel">
            <h2>게임 종료!</h2>
            <p>최종 점수: <span id="final-score">0</span>점</p>
            <button id="restart-btn">다시 하기</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
