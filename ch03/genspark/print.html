<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>슬라이드 PDF 저장 - Vibe Coding</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      text-align: center;
    }
    .slide-wrapper {
      margin: 40px auto;
      width: 1920px;
      height: 1080px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      /* 인쇄 시 페이지 나누기 */
      page-break-after: always;
      break-after: page;
    }
    iframe {
      width: 1920px;
      height: 1080px;
      border: none;
      /* iframe 내 내비게이션 스크립트 실행이나 이벤트 간섭 방지 */
      pointer-events: none; 
    }
    
    @media print {
      body { 
        background: white; 
        margin: 0; 
        padding: 0; 
      }
      .slide-wrapper {
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
      }
      @page {
        size: 1920px 1080px;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="slide-wrapper"><iframe src="slides/01-cover.html" scrolling="no"></iframe></div>
  <div class="slide-wrapper"><iframe src="slides/02-definition.html" scrolling="no"></iframe></div>
  <div class="slide-wrapper"><iframe src="slides/03-history.html" scrolling="no"></iframe></div>
  <div class="slide-wrapper"><iframe src="slides/04-role-change.html" scrolling="no"></iframe></div>
  <div class="slide-wrapper"><iframe src="slides/05-agent-engineering.html" scrolling="no"></iframe></div>
  <div class="slide-wrapper"><iframe src="slides/06-limitations.html" scrolling="no"></iframe></div>
  <div class="slide-wrapper"><iframe src="slides/07-conclusion.html" scrolling="no"></iframe></div>
</body>
</html>
